name: measure

on:
  push:
    branches: [main]
    paths: ["measure/**", ".github/workflows/measure.yml"]
  pull_request:
    paths: ["measure/**", ".github/workflows/measure.yml"]

jobs:
  check:
    name: fmt, clippy, test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: measure
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: measure
      - run: cargo fmt --all -- --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test
      # The browser build: its own feature set and target, which the checks
      # above never compile.
      - run: rustup target add wasm32-unknown-unknown
      - run: cargo clippy --no-default-features --features wasm --target wasm32-unknown-unknown -- -D warnings
      - run: cargo test --features wasm --lib
