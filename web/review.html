<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Koenami · 聴取レビュー</title><meta name="robots" content="noindex"><script src="./theme.js"></script><link rel="stylesheet" href="./style.css">
<style>
html,body{height:auto;overflow:visible}
.review{max-width:720px;margin:0 auto;padding:28px 16px 60px;display:flex;flex-direction:column;gap:18px}
.review-head{display:flex;align-items:center;gap:14px}.review-head h1{font-size:15px;margin:0;color:var(--heading)}.review-head .mode{display:inline-flex;border:1px solid var(--line);border-radius:999px;overflow:hidden}.review-head .mode button{border:0;background:transparent;padding:5px 12px;font:inherit;font-size:12px;color:var(--muted);cursor:pointer}.review-head .mode button[aria-pressed=true]{background:var(--raised);color:var(--ink)}
.scale[data-missing=true] .name:after{content:' ·';color:var(--accent)}
.review-head .progress{font-size:12px;color:var(--muted);margin-left:auto;font-variant-numeric:tabular-nums}
.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:20px 22px;display:flex;flex-direction:column;gap:16px}
.speaker{display:flex;align-items:center;gap:10px}.list-button{margin-left:auto;display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--raised);color:var(--ink);border-radius:8px;padding:6px 10px;font:inherit;font-size:12px;cursor:pointer}.list-button svg{width:16px;height:16px}.list-button kbd{font:inherit;color:var(--muted)}
#list-dialog{width:min(560px,calc(100vw - 32px));max-height:80vh;display:flex;flex-direction:column;gap:10px}#list-dialog:not([open]){display:none}#list-items{overflow:auto;min-height:0;display:flex;flex-direction:column;gap:2px}.list-item{display:grid;grid-template-columns:auto auto 1fr;align-items:baseline;gap:10px;text-align:left;border:0;background:transparent;color:var(--ink);font:inherit;padding:7px 10px;border-radius:7px;cursor:pointer}.list-item:hover{background:var(--raised)}.list-item[aria-current=true]{background:var(--selected)}.list-item .mark{font-size:11px;color:var(--accent)}.list-item small{color:var(--muted);font-size:11px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.review-head koe-select{font-size:13px}.speaker strong{font-size:26px;color:var(--heading);letter-spacing:.02em}.speaker span{font-size:12px;color:var(--muted)}
.clip{display:grid;grid-template-columns:auto 1fr auto;align-items:center;gap:12px}.clip .text{font-size:15px;line-height:1.6;color:var(--ink)}.clip .text small{display:block;color:var(--muted);font-size:11px}
.clip nav{display:flex;gap:4px}.clip nav button,.play{border:1px solid var(--line);background:var(--raised);color:var(--ink);border-radius:8px;min-width:34px;height:34px;font:inherit;cursor:pointer}.play{width:44px;height:44px;border-radius:50%;font-size:16px}.play[aria-pressed=true]{background:var(--accent);color:#fff;border-color:transparent}
.scale-group{font-size:11px;color:var(--muted);padding:10px 8px 2px;letter-spacing:.06em}
.scale{display:grid;grid-template-columns:130px 1fr 40px;align-items:center;gap:10px;padding:6px 8px;border-radius:8px}.scale[data-active=true]{background:var(--selected)}.scale .name{font-size:13px}.scale .steps{display:flex;gap:4px}
.scale .steps button{flex:1;height:30px;border:1px solid var(--line);background:transparent;border-radius:6px;color:var(--muted);font:inherit;font-size:12px;cursor:pointer}.scale .steps button[aria-pressed=true]{background:var(--accent);border-color:transparent;color:#fff}
.scale .ends{grid-column:2;display:flex;justify-content:space-between;font-size:10px;color:var(--muted);margin-top:-6px}.scale output{font-size:12px;color:var(--muted);text-align:right}
.flags{display:flex;flex-wrap:wrap;gap:6px;align-items:center}.flags .group{font-size:11px;color:var(--muted);width:44px}
.flags .scope{margin-left:auto;display:inline-flex;border:1px solid var(--line);border-radius:999px;overflow:hidden}.flags .scope button{border:0;border-radius:0;background:transparent;padding:5px 10px;font-size:11px;color:var(--muted)}.flags .scope button[aria-pressed=true]{background:var(--raised);color:var(--ink)}.flags .scope button kbd{color:inherit;opacity:.6}
.flags button{border:1px solid var(--line);background:transparent;color:var(--ink);border-radius:999px;padding:5px 11px;font:inherit;font-size:12px;cursor:pointer}.flags button kbd{font:inherit;color:var(--muted);margin-left:5px}.flags button[aria-pressed=true]{background:var(--pink);border-color:transparent;color:#fff}.flags button[aria-pressed=true] kbd{color:#ffffffb0}
.note{width:100%;font:inherit;font-size:13px;padding:8px 10px;border:1px solid var(--line);border-radius:8px;background:var(--surface);color:var(--ink)}
.actions{display:flex;gap:10px;align-items:center}.actions .status{font-size:12px;color:var(--muted);flex:1}.actions button{font:inherit;font-size:13px;padding:9px 16px;border-radius:8px;border:1px solid var(--line);background:var(--raised);color:var(--ink);cursor:pointer}.actions .primary{background:var(--accent);color:#fff;border-color:transparent}
.actions kbd{font:inherit;opacity:.6;margin-left:6px}
.log{font-size:12px;color:var(--muted);display:flex;flex-direction:column;gap:4px}.log strong{color:var(--ink)}
.done{text-align:center;padding:40px 0;color:var(--muted)}
</style></head><body>
<main class="review">
<svg class="sprite" aria-hidden="true" style="display:none"><defs><symbol id="i-globe" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><ellipse cx="12" cy="12" rx="4" ry="9"/><path d="M3 12h18"/></symbol><symbol id="i-sun" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2v2m0 16v2M2 12h2m16 0h2M5 5l1.4 1.4m11.2 11.2L19 19M5 19l1.4-1.4M17.6 6.4 19 5"/></symbol><symbol id="i-moon" viewBox="0 0 24 24"><path d="M20.7 13.2A9 9 0 0 1 10.8 3.3 9 9 0 1 0 20.7 13.2Z"/></symbol><symbol id="i-list" viewBox="0 0 24 24"><path d="M4 6h16M4 12h16M4 18h16"/></symbol></defs></svg>
<div class="review-head"><h1>聴取レビュー</h1><koe-select id="lang" icon="i-globe" aria-label="言語"><option value="ja">日本語</option><option value="zh-CN">普通话</option><option value="en">English</option><option value="ko">한국어</option></koe-select><span class="segment mode" id="mode"><button type="button" data-mode="new" aria-pressed="true">新規</button><button type="button" data-mode="update" aria-pressed="false">追加項目</button></span><span class="progress" id="progress"></span><button id="theme-button" class="icon-button" title="明暗を切り替え" aria-label="明暗を切り替え"><svg aria-hidden="true"><use href="#i-moon"></use></svg></button></div>
<section class="card" id="card" hidden>
 <div class="speaker"><button id="prev-speaker" class="icon-button" title="前の話者" aria-label="前の話者"><svg aria-hidden="true" viewBox="0 0 24 24"><path d="m15 5-7 7 7 7"/></svg></button><strong id="display"></strong><span id="speaker-meta"></span><button id="jump" class="list-button" type="button"><svg aria-hidden="true"><use href="#i-list"></use></svg>一覧<kbd>L</kbd></button></div>
 <div class="clip"><button class="play" id="play" aria-pressed="false" aria-label="再生" title="Space：再生／一時停止　R：最初から">▶</button><div class="text" id="text"></div><nav><button id="prev-clip" aria-label="前の音声">‹</button><button id="next-clip" aria-label="次の音声">›</button></nav></div>
 <div id="scales"></div>
 <div class="flags" id="quality-flags"><span class="group">問題</span><span class="scope" id="scope" hidden><button type="button" id="scope-clip" aria-pressed="true">この音声だけ</button><button type="button" id="scope-speaker" aria-pressed="false">話者の全音声<kbd>A</kbd></button></span></div>
 <input class="note" id="note" placeholder="メモ">
 <div class="actions"><span class="status" id="status"></span><button id="skip">スキップ<kbd>S</kbd></button><button class="primary" id="save">保存して次へ<kbd>Enter</kbd></button></div>
</section>
<p class="done" id="done" hidden></p>
<div class="log" id="log"></div>
<dialog id="list-dialog"><div class="dialog-heading"><h2>話者一覧 <span id="list-count" class="small"></span></h2><button class="icon-button" data-close aria-label="閉じる">×</button></div><input id="list-filter" class="note" placeholder="番号や文で絞り込む" autocomplete="off"><div id="list-items"></div></dialog>
</main>
<script type="module" src="./controls.js"></script><script type="module" src="./review.js"></script>
</body></html>
