[package]
name = "koenami-measure"
version = "4.1.0"
edition = "2024"
rust-version = "1.88"
license = "MIT"
description = "Koenami's acoustic measurement: pitch, resonance, harmonicity and spectral balance on the Phonia crates"
publish = false

[lib]
crate-type = ["rlib", "cdylib"]

[[bin]]
name = "koenami-measure"
path = "src/bin/koenami-measure.rs"
required-features = ["cli"]

[features]
default = ["cli"]
cli = ["dep:rayon"]
# The browser build: wasm-bindgen entry points over the same measurement.
wasm = ["dep:wasm-bindgen"]

[dependencies]
phx-audio = { git = "https://github.com/mkpoli/phonia", rev = "25a7a5fb16d627c3a21da623364bf7782838094f" }
phx-dsp = { git = "https://github.com/mkpoli/phonia", rev = "25a7a5fb16d627c3a21da623364bf7782838094f" }
phx-pitch = { git = "https://github.com/mkpoli/phonia", rev = "25a7a5fb16d627c3a21da623364bf7782838094f" }
phx-formant = { git = "https://github.com/mkpoli/phonia", rev = "25a7a5fb16d627c3a21da623364bf7782838094f" }
phx-voice = { git = "https://github.com/mkpoli/phonia", rev = "25a7a5fb16d627c3a21da623364bf7782838094f" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
rayon = { version = "1", optional = true }
wasm-bindgen = { version = "0.2", optional = true }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
