[package]
name = "koenami-measure"
version = "4.0.0"
edition = "2024"
rust-version = "1.88"
license = "MIT"
description = "Koenami's acoustic measurement: pitch, resonance, harmonicity and spectral balance on the Phonia crates"
publish = false

[lib]
crate-type = ["rlib", "cdylib"]

[[bin]]
name = "koenami-measure"
path = "src/bin/koenami-measure.rs"
required-features = ["cli"]

[features]
default = ["cli"]
cli = ["dep:rayon"]

[dependencies]
phx-audio = { git = "https://github.com/mkpoli/phonia", rev = "d87a7ab1f438733e0bb214f5825a8fe3e094f18d" }
phx-dsp = { git = "https://github.com/mkpoli/phonia", rev = "d87a7ab1f438733e0bb214f5825a8fe3e094f18d" }
phx-pitch = { git = "https://github.com/mkpoli/phonia", rev = "d87a7ab1f438733e0bb214f5825a8fe3e094f18d" }
phx-formant = { git = "https://github.com/mkpoli/phonia", rev = "d87a7ab1f438733e0bb214f5825a8fe3e094f18d" }
phx-voice = { git = "https://github.com/mkpoli/phonia", rev = "d87a7ab1f438733e0bb214f5825a8fe3e094f18d" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
rayon = { version = "1", optional = true }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
